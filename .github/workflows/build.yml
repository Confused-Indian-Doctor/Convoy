name: Build Convoy 0.3.1 unsigned

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 tools
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Fetch source and apply 0.3.1 patch
        run: |
          curl -fL --retry 3 'https://cb2f5cbc-8097-415e-9aa7-aaa4176cb607.sandbox.floot.app/_cdn/static/50c34f3b-3db2-4193-8458-a7229b82da8b-convoy-0.3.0-source.zip' -o source.zip
          echo '582181e3ccd57a3bc1c32531d51736acfcdb5386f69e3225e01f9ed7912c9eda  source.zip' | sha256sum -c -
          unzip -q source.zip
          mv v0.3 work
          echo '' | base64 -d | gzip -d > work/app031.patch
          cd work && patch -p1 < app031.patch
      - name: Download ECJ
        run: curl -fsSL 'https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.40.0/ecj-3.40.0.jar' -o ecj.jar
      - name: Build aligned unsigned APK
        run: |
          set -euo pipefail
          cd work
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          AJ="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          mkdir -p build/generated build/classes build/dex build/test-classes
          "$BT/aapt2" compile --dir app/src/main/res -o build/resources.zip
          "$BT/aapt2" link -o build/base.apk -I "$AJ" --manifest app/src/main/AndroidManifest.xml --java build/generated --min-sdk-version 26 --target-sdk-version 35 --version-code 5 --version-name 0.3.1 build/resources.zip
          java -jar ../ecj.jar -encoding UTF-8 -8 -proc:none -classpath "$AJ" -d build/classes app/src/main/java/com/convoy/offline/*.java build/generated/com/convoy/offline/R.java
          python3 - <<'PY2'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('build/classes.jar','w',ZIP_DEFLATED) as z:
              for p in Path('build/classes').rglob('*.class'): z.write(p,p.relative_to('build/classes'))
          PY2
          "$BT/d8" --min-api 26 --lib "$AJ" --output build/dex build/classes.jar
          python3 - <<'PY3'
          from zipfile import ZipFile, ZIP_DEFLATED, ZIP_STORED
          from pathlib import Path
          with ZipFile('build/base.apk') as src, ZipFile('build/unsigned.apk','w',ZIP_DEFLATED) as dst:
              for n in src.namelist(): dst.writestr(n,src.read(n),compress_type=ZIP_STORED if n=='resources.arsc' else ZIP_DEFLATED)
              for p in Path('build/dex').glob('*.dex'): dst.write(p,p.name)
          PY3
          "$BT/zipalign" -f 4 build/unsigned.apk build/Convoy-0.3.1-aligned-unsigned.apk
          "$BT/zipalign" -c 4 build/Convoy-0.3.1-aligned-unsigned.apk
          java -jar ../ecj.jar -encoding UTF-8 -8 -proc:none -d build/test-classes app/src/main/java/com/convoy/offline/Wire.java tests/WireTest.java
          java -cp build/test-classes com.convoy.offline.WireTest | tee build/protocol-tests.txt
          cp "$BT/lib/apksigner.jar" build/apksigner.jar
          sha256sum build/Convoy-0.3.1-aligned-unsigned.apk | tee build/unsigned.sha256
      - name: Upload unsigned build and signer
        uses: actions/upload-artifact@v4
        with:
          name: Convoy-0.3.1-unsigned
          path: |
            work/build/Convoy-0.3.1-aligned-unsigned.apk
            work/build/apksigner.jar
            work/build/protocol-tests.txt
            work/build/unsigned.sha256
          if-no-files-found: error
          retention-days: 7
