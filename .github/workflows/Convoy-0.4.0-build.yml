name: Build and validate Convoy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: convoy-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android 35 tools
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Run protocol and offline-data tests
        run: |
          bash tools/run_protocol_tests.sh
          python3 -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee build/region-tests.txt
          python3 tools/run_pmtiles_validation_tests.py 2>&1 | tee build/pmtiles-validation-tests.txt

      - name: Restore matching offline region
        id: region-cache
        uses: actions/cache@v4
        with:
          key: convoy-region-v040-${{ hashFiles('tools/fetch_shrewsbury_region.sh', 'tools/build_shrewsbury_region.py') }}
          path: |
            app/src/main/assets/shrewsbury.pmtiles
            app/src/main/assets/overture-shrewsbury.pmtiles
            app/src/main/assets/route.graph
            app/src/main/assets/places.db
            app/src/main/assets/fonts
            app/src/main/assets/region-provenance.json
            build/region-cache

      - name: Build Shrewsbury offline vector region
        if: steps.region-cache.outputs.cache-hit != 'true'
        run: bash tools/fetch_shrewsbury_region.sh

      - name: Build, lint and verify APKs from checked-in source
        run: |
          bash tools/run_routing_tests.sh app/src/main/assets/route.graph
          bash build-local.sh --skip-region --skip-tests
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          echo "CONVOY_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sign release with the existing private Convoy identity
        env:
          CONVOY_KEYSTORE_BASE64: ${{ secrets.CONVOY_KEYSTORE_BASE64 }}
          CONVOY_KEYSTORE_PASSWORD: ${{ secrets.CONVOY_KEYSTORE_PASSWORD }}
          CONVOY_KEY_ALIAS: ${{ secrets.CONVOY_KEY_ALIAS }}
          CONVOY_KEY_PASSWORD: ${{ secrets.CONVOY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$CONVOY_KEYSTORE_BASE64" ]]; then
            bash tools/sign_release.sh \
              "build/release/Convoy-${CONVOY_VERSION}-aligned-unsigned.apk" \
              "build/release/Convoy-${CONVOY_VERSION}.apk" | tee build/release/signing-verification.txt
            echo 'CONVOY_RELEASE_SIGNED=true' >> "$GITHUB_ENV"
          else
            echo 'The release is unsigned. Configure the existing private Convoy signing secrets for an installable update.'
          fi

      - name: Upload aligned unsigned release and validation
        uses: actions/upload-artifact@v4
        with:
          name: Convoy-${{ env.CONVOY_VERSION }}-unsigned
          path: |
            build/release/Convoy-${{ env.CONVOY_VERSION }}-aligned-unsigned.apk
            build/release/unsigned.sha256
            build/release/apk-badging.txt
            build/release/packaging-checks.txt
            build/protocol-tests.txt
            build/routing-tests.txt
            build/pmtiles-validation-tests.txt
            build/region-tests.txt
            build/android-build.txt
            app/src/main/assets/region-provenance.json
            app/build/reports/lint-results-release.*
          if-no-files-found: error
          retention-days: 14

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch offline on an Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/emulator_smoke.sh

      - name: Upload signed installable release
        if: env.CONVOY_RELEASE_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Convoy-${{ env.CONVOY_VERSION }}-installable-release
          path: |
            build/release/Convoy-${{ env.CONVOY_VERSION }}.apk
            build/release/signing-verification.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload emulator evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Convoy-${{ env.CONVOY_VERSION || 'build' }}-validation
          path: |
            build/smoke/
            build/protocol-tests.txt
            build/routing-tests.txt
            build/pmtiles-validation-tests.txt
            build/region-tests.txt
            build/android-build.txt
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
